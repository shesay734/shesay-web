<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a765c5">
  <title>My wallet · SheSay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main class="wallet-shell">
    <div class="brand">SHE SAY / WALLET</div>
    <section id="loading" class="paper wallet-card muted">Signing in securely and loading your balance…</section>
    <section id="wallet" class="paper wallet-card hidden">
      <h1>Your wallet</h1>
      <p id="name" class="wallet-name">SheSay user</p>
      <div id="balance" class="amount">$0.00</div>
      <p class="muted">Use your balance to subscribe, purchase content, and support authors.</p>
      <div class="wallet-actions"><button id="refresh" class="button" type="button">Refresh balance</button><button id="logout" class="button ghost" type="button">Log out</button></div>
      <div class="recharge">
        <strong>Top up</strong>
        <p class="muted">Choose a method to begin.</p>
        <div id="paymentOptions" class="payment-options"></div>
        <div id="rechargeForm" class="recharge-form hidden">
          <label for="rechargeAmount">充值金额 (USD)</label>
          <input id="rechargeAmount" type="number" min="1" step="0.01" inputmode="decimal" placeholder="1.00">
          <label for="rechargePaid">实付金额 (USDT)</label>
          <input id="rechargePaid" type="number" min="1" step="0.01" inputmode="decimal" placeholder="1.00">
          <label for="rechargeAddress">付款地址 (USDT)</label>
          <input id="rechargeAddress" type="text" placeholder="你的 USDT 收款地址">
          <button id="rechargeSubmit" class="button" type="button">提交充值申请</button>
        </div>
        <div id="notice" class="notice" aria-live="polite"></div>
      </div>
    </section>
    <section id="login" class="paper wallet-card hidden"><p class="muted">Log in to your SheSay account first.</p><a href="auth.html#login">Log in or sign up</a></section>
  </main>
  <script src="site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sb = SheSay.client;
    function notice(message, kind = '') { $('notice').textContent = message; $('notice').className = `notice ${kind}`; }
    let _selectedMethod = null;
    function openRechargeForm(method) {
      _selectedMethod = method;
      $('rechargeForm').classList.remove('hidden');
      $('rechargeSubmit').disabled = false;
      $('rechargeAmount').value = '';
      $('rechargePaid').value = '';
      $('rechargeAddress').value = '';
      notice('选择 USDT 渠道。请将你的充值金额与付款地址填入后提交申请。');
    }
    async function submitRecharge() {
      const amount = Number($('rechargeAmount').value);
      const paid = Number($('rechargePaid').value);
      const address = $('rechargeAddress').value.trim();
      if (!_selectedMethod || !Number.isFinite(amount) || amount < 1 || !Number.isFinite(paid) || paid < amount) {
        notice('请填写有效的充值金额（≥$1）与实付金额（≥充值金额）。', 'error');
        return;
      }
      if (address.length < 12) {
        notice('请填写有效的 USDT 付款地址（至少 12 位）。', 'error');
        return;
      }
      $('rechargeSubmit').disabled = true;
      notice('正在提交充值申请…');
      try {
        const { data, error } = await sb.rpc('create_usdt_recharge_request', {
          requested_amount: amount,
          requested_paid_amount: paid,
          requested_payer_crypto_address: address,
          requested_payment_method_id: _selectedMethod.id,
        });
        if (error) throw error;
        notice(`充值订单已提交，订单号 ${data}。请等待管理员确认后到账（处理中）。`, 'success');
      } catch (error) {
        notice(error?.message || '充值申请提交失败，请稍后重试。', 'error');
      } finally {
        $('rechargeSubmit').disabled = false;
      }
    }
    async function load() {
      const { data: { user } } = await sb.auth.getUser();
      $('loading').classList.add('hidden');
      if (!user) { $('login').classList.remove('hidden'); return; }
      $('wallet').classList.remove('hidden');
      $('name').textContent = user.user_metadata?.nickname || user.email || 'SheSay user';
      const { data, error } = await sb.from('wallets').select('balance').eq('user_id', user.id).maybeSingle();
      $('balance').textContent = '$' + Number(data?.balance || 0).toFixed(2);
      if (error) notice('Could not load your balance. Please refresh and try again.', 'error');

      const { data: methods, error: methodsError } = await sb
        .from('payment_methods')
        .select('id,method,display_name,network,address,note,sort_order')
        .order('sort_order', { ascending: true })
        .order('id', { ascending: true });

      const options = $('paymentOptions');
      options.replaceChildren();

      if (methodsError) {
        notice('Could not load payment methods. Please refresh and try again.', 'error');
      } else if (!methods?.length) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = 'No top-up methods are currently available.';
        options.appendChild(empty);
      } else {
        for (const method of methods) {
          const button = document.createElement('button');
          button.className = 'payment-option';
          button.type = 'button';

          const title = document.createElement('strong');
          title.textContent = [method.display_name || method.method, method.network]
            .filter(Boolean)
            .join(' · ');

          const detail = document.createElement('span');
          detail.textContent = method.note || 'View receiving details';

          button.append(title, detail);
          button.onclick = () => openRechargeForm(method);
          options.appendChild(button);
        }
      }
    }
    $('refresh').onclick = load;
    $('logout').onclick = async () => { await sb.auth.signOut(); location.replace('auth.html#login'); };
    $('rechargeSubmit').onclick = submitRecharge;
    load();
  </script>
</body>
</html>
