<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a765c5">
  <title>My wallet · SheSay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main class="wallet-shell">
    <div class="brand">SHE SAY / WALLET</div>
    <section id="loading" class="paper wallet-card muted">Signing in securely and loading your balance…</section>
    <section id="wallet" class="paper wallet-card hidden">
      <h1>Your wallet</h1>
      <p id="name" class="wallet-name">SheSay user</p>
      <div id="balance" class="amount">$0.00</div>
      <p class="muted">Use your balance to subscribe, purchase content, and support authors.</p>
      <div class="wallet-actions"><button id="refresh" class="button" type="button">Refresh balance</button><button id="logout" class="button ghost" type="button">Log out</button></div>
      <div class="recharge">
        <strong>Top up</strong>
        <p class="muted">Choose a method to begin.</p>
        <div id="paymentOptions" class="payment-options"></div>
        <div class="gift-card">
          <button id="giftCardToggle" class="button ghost" type="button" aria-expanded="false" aria-controls="giftCardPanel">Redeem a gift card</button>
          <div id="giftCardPanel" class="gift-card-panel hidden">
            <label for="giftCardCode">Gift card code</label>
            <div class="code-row">
              <input id="giftCardCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" placeholder="Enter your gift card code">
              <button id="giftCardRedeem" class="button" type="button">Redeem</button>
            </div>
          </div>
        </div>
        <div id="notice" class="notice" aria-live="polite"></div>
      </div>
    </section>
    <section id="login" class="paper wallet-card hidden"><p class="muted">Log in to your SheSay account first.</p><a href="auth.html#login">Log in or sign up</a></section>
  </main>
  <script src="site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sb = SheSay.client;
    const escapeHtml = value => { const node = document.createElement('div'); node.textContent = value ?? ''; return node.innerHTML; };
    function notice(message, kind = '') { $('notice').textContent = message; $('notice').className = `notice ${kind}`; }
    function renderPaymentMethods(methods) {
      $('paymentOptions').innerHTML = methods.map(method => {
        const details = [method.network, method.address, method.note].filter(Boolean).join(' · ');
        return `<button class="payment-option" type="button"><strong>${escapeHtml(method.display_name)}</strong><span>${escapeHtml(details || 'Payment instructions are not configured yet.')}</span></button>`;
      }).join('');
    }
    async function currentUser() {
      const { data } = await sb.auth.getUser();
      return data.user;
    }
    async function refreshBalance(user) {
      const account = user || await currentUser();
      if (!account) return null;
      const { data, error } = await sb.from('wallets').select('balance').eq('user_id', account.id).maybeSingle();
      $('balance').textContent = '$' + Number(data?.balance || 0).toFixed(2);
      return error;
    }
    function setGiftCardPanel(open) {
      $('giftCardPanel').classList.toggle('hidden', !open);
      $('giftCardToggle').setAttribute('aria-expanded', String(open));
      if (open) $('giftCardCode').focus();
    }
    function giftCardMessage(error) {
      const message = String(error?.message || error?.details || '');
      if (/not found/i.test(message)) return 'That gift card code was not found. Check the code and try again.';
      if (/already been used/i.test(message)) return 'That gift card has already been used.';
      if (/sign in is required/i.test(message)) return 'Please log in again and retry.';
      if (/code is required/i.test(message)) return 'Enter your gift card code first.';
      return 'Could not redeem the gift card. Please try again.';
    }
    async function redeemGiftCard() {
      const code = $('giftCardCode').value.trim();
      if (!code) { notice('Enter your gift card code first.', 'error'); return; }
      const button = $('giftCardRedeem');
      button.disabled = true;
      notice('Redeeming your gift card…');
      try {
        const { data, error } = await sb.rpc('redeem_gift_card', { target_code: code });
        if (error) throw error;
        const credited = Number(data || 0);
        $('giftCardCode').value = '';
        notice(`Gift card redeemed. $${credited.toFixed(2)} was added to your balance.`, 'success');
        await refreshBalance();
      } catch (error) {
        notice(giftCardMessage(error), 'error');
      } finally {
        button.disabled = false;
      }
    }
    async function load() {
      const { data: { user } } = await sb.auth.getUser();
      $('loading').classList.add('hidden');
      if (!user) { $('login').classList.remove('hidden'); return; }
      $('wallet').classList.remove('hidden');
      $('name').textContent = user.user_metadata?.nickname || user.email || 'SheSay user';
      const balanceError = await refreshBalance(user);
      if (balanceError) notice('Could not load your balance. Please refresh and try again.', 'error');
      const methods = await sb.from('payment_methods').select('id,method,display_name,network,address,note').eq('method', 'usdt').order('sort_order').order('id');
      if (methods.error) notice('Could not load payment instructions. Please refresh and try again.', 'error');
      else renderPaymentMethods(methods.data || []);
    }
    $('refresh').onclick = load;
    $('logout').onclick = async () => { await sb.auth.signOut(); location.replace('auth.html#login'); };
    $('giftCardToggle').onclick = () => setGiftCardPanel($('giftCardPanel').classList.contains('hidden'));
    $('giftCardRedeem').onclick = redeemGiftCard;
    $('giftCardCode').addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); redeemGiftCard(); }
    });

    load();
  </script>
</body>
</html>
