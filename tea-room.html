<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a765c5">
  <title>她说 · 茶室</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f3f7; color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .page { min-height: 100vh; padding: 28px 16px 40px; }
    .card { max-width: 520px; margin: 0 auto; overflow: hidden; border: 1px solid #ebe4ed; border-radius: 20px; background: #fff; box-shadow: 0 5px 16px rgba(63,31,70,.04); }
    .hero { height: 220px; background: #f1f1f1 center / cover no-repeat; }
    .content { padding: 18px; }
    .room { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; background: #eee; }
    .avatar-fallback { display: flex; align-items: center; justify-content: center; color: #a765c5; font-size: 24px; }
    .name { font-size: 21px; font-weight: 700; }
    .label { margin-top: 20px; color: #777; font-size: 13px; }
    .announcement { margin-top: 7px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .open { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; margin-top: 24px; border-radius: 22px; background: #a765c5; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; }
        .download-gate { margin-top: 16px; padding: 18px; border: 1px solid #ebe4ed; border-radius: 16px; background: #faf8fb; text-align: center; }
        .download-gate strong, .download-gate span { display: block; }
        .download-gate span { margin: 6px 0 14px; color: #777; font-size: 13px; }
        .status { max-width: 520px; margin: 16px auto 0; color: #777; text-align: center; font-size: 13px; }
        .hidden { display: none; }
      </style>
    </head>
    <body>
      <main class="page">
        <section id="card" class="card hidden">
          <div id="hero" class="hero"></div>
          <div class="content">
            <div class="room">
              <img id="avatar" class="avatar hidden" alt="茶室头像">
              <div id="avatarFallback" class="avatar avatar-fallback">茶</div>
              <div id="name" class="name"></div>
            </div>
            <div class="label">公告</div>
            <div id="announcement" class="announcement"></div>
            <a id="openApp" class="open" href="#">打开APP加入茶室</a>
            <div id="downloadGate" class="download-gate hidden">
              <strong>您还未下载app</strong>
              <span>下载 SheSay App 后即可打开此内容。</span>
              <a class="open" href="https://play.google.com/store/apps/details?id=com.shesay_app" target="_blank" rel="noopener">下载</a>
            </div>
          </div>
        </section>
    <div id="status" class="status">正在加载茶室…</div>
  </main>
  <script>
    const endpoint = 'https://suxprwbmoakcbopjuosa.supabase.co/rest/v1/rpc/get_tea_room_share_card';
    const apiKey = 'sb_publishable_JsggCmnvB1Q50l5z2W11Uw_AfKLxCx7';
    const id = (new URLSearchParams(location.search).get('id') || '').trim();
    const status = document.getElementById('status');
    const card = document.getElementById('card');
    const openApp = document.getElementById('openApp');
    const APP_HOME = 'https://xn--1uss88i.com/';
    let openAppPending = false;
    function launchApp(deepLink) {
      if (!deepLink || openAppPending) return;
      openAppPending = true;
      if (/Android/i.test(navigator.userAgent)) {
        location.href = deepLink.replace(/^shesay:\/\//, 'intent://') +
          '#Intent;scheme=shesay;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=' +
          encodeURIComponent(APP_HOME) + ';end';
        setTimeout(() => { openAppPending = false; }, 250);
        return;
      }
      const cancel = () => {
        clearTimeout(fallbackTimer);
        document.removeEventListener('visibilitychange', onVisibility);
        window.removeEventListener('pagehide', cancel);
        openAppPending = false;
      };
      const onVisibility = () => { if (document.hidden) cancel(); };
      document.addEventListener('visibilitychange', onVisibility);
      window.addEventListener('pagehide', cancel);
      const fallbackTimer = setTimeout(() => {
              const stillVisible = document.visibilityState === 'visible';
              cancel();
              if (stillVisible) showDownloadPrompt();
            }, 1200);
            location.href = deepLink;
          }
          function showDownloadPrompt() {
            const gate = document.getElementById('downloadGate');
            if (gate) gate.classList.remove('hidden');
            const link = document.getElementById('openApp');
            if (link) link.textContent = '您还未下载app';
          }
    const safeUrl = value => {
      try {
        const url = new URL(value);
        return url.protocol === 'https:' ? url.href : '';
      } catch (_) {
        return '';
      }
    };

    if (!id) {
      status.textContent = '茶室链接无效';
    } else {
      openApp.href = 'shesay://tea-room?id=' + encodeURIComponent(id);
      openApp.addEventListener('click', event => {
        event.preventDefault();
        if (openApp.href.startsWith('shesay://')) launchApp(openApp.href);
      });
      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: apiKey },
        body: JSON.stringify({ target_room_id: id }),
      })
        .then(response => {
          if (!response.ok) throw new Error();
          return response.json();
        })
        .then(data => {
          const room = Array.isArray(data) ? data[0] : data;
          if (!room) throw new Error();
          document.getElementById('name').textContent = room.name || '茶室';
          document.getElementById('announcement').textContent = room.announcement || '暂无公告';
          const background = safeUrl(room.background_image_url || '');
          if (background) document.getElementById('hero').style.backgroundImage = `url("${background.replaceAll('"', '%22')}")`;
          const avatar = safeUrl(room.avatar_url || '');
          if (avatar) {
            const image = document.getElementById('avatar');
            image.src = avatar;
            image.classList.remove('hidden');
            document.getElementById('avatarFallback').classList.add('hidden');
          }
          card.classList.remove('hidden');
          status.classList.add('hidden');
        })
        .catch(() => { status.textContent = '茶室不存在或暂时无法加载'; });
    }
  </script>
</body>
</html>
