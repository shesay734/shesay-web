name: Web checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check site.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_inline_script = False
                  self.inline_scripts = []
                  self.current = []
                  self.local_scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag != 'script':
                      return
                  attrs = dict(attrs)
                  src = attrs.get('src')
                  if src:
                      if not src.startswith(('http://', 'https://', '//')):
                          self.local_scripts.append(src)
                  else:
                      self.in_inline_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_inline_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_inline_script:
                      self.inline_scripts.append(''.join(self.current))
                      self.in_inline_script = False
                      self.current = []

          for html in sorted(Path('.').glob('*.html')):
              parser = ScriptParser()
              parser.feed(html.read_text(encoding='utf-8'))
              for src in parser.local_scripts:
                  path = html.parent / src
                  if not path.exists():
                      raise SystemExit(f'{html}: missing local script {src}')
              for index, script in enumerate(parser.inline_scripts, 1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as tmp:
                      tmp.write(script)
                      tmp.flush()
                      subprocess.run(['node', '--check', tmp.name], check=True)
              print(f'checked {html}')
          PY

      - name: Reject server secrets in public web files
        shell: bash
        run: |
          if grep -RniE 'service[_-]?role|sb_secret_' --include='*.js' --include='*.html' .; then
            echo "Server-side Supabase credentials must not be committed to the public web app."
            exit 1
          fi
