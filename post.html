<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="app-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>SheSay post</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="share.css">
</head>
<body class="share-page share-post">
  <main class="share-shell">
    <a class="share-skip" href="#share-content">Skip to content</a>
    <header class="share-header">
      <a class="share-brand" href="app.html"><img src="app-icon.png" alt="" width="40" height="40"><span>SheSay<small>Stories. Connections. Community.</small></span></a>
      <a class="share-explore" href="app.html">Discover SheSay <span aria-hidden="true">↗</span></a>
    </header>
    <div id="share-content" tabindex="-1"></div>
    <header id="login-card" class="home-header shared-login hidden">
      <span class="share-account-label">Your stories, all in one place.</span>
      <nav class="home-auth" aria-label="Account"><a id="login-link">Log in</a><a id="register-link" class="home-register">Register</a></nav>
    </header>
    <article id="post" class="paper shared-post"><p class="eyebrow">SHARED STORY</p><div class="share-loading" role="status">Loading story…</div></article>
    <div id="notice" class="notice" aria-live="polite"></div>
    <aside class="share-discover" aria-label="Discover SheSay"><img src="app-icon.png" alt="" width="44" height="44"><div><strong>A little closer to your community.</strong><p>Discover more stories and conversations on SheSay.</p></div><a href="app.html">Explore the app <span aria-hidden="true">↗</span></a></aside>
    <footer class="share-footer"><span>Shared on SheSay</span><nav aria-label="Footer"><a href="help-feedback.html">Help</a><a href="privacy-policy.html">Privacy</a><a href="terms-of-service.html">Terms</a></nav></footer>
  </main>
  <script src="i18n.js"></script>
  <script src="site.js"></script>
  <script src="open-app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const el = document.getElementById('post');
    const notice = document.getElementById('notice');
    const sb = SheSay.client;
    let session = null;
    let shared = null;
    const escapeHtml = value => { const node = document.createElement('div'); node.textContent = value ?? ''; return node.innerHTML; };
    const money = value => Number(value || 0).toFixed(2);
    // Post bodies embed images as `![](https://…)`; render those as images and
    // keep everything else as escaped text.
    const bodyHtml = value => {
      const text = String(value ?? '');
      const pattern = /!\[[^\]]*\]\(([^)\s]+)\)/g;
      let html = '';
      let last = 0;
      for (const match of text.matchAll(pattern)) {
        html += escapeHtml(text.slice(last, match.index));
        let src = '';
        try { const url = new URL(match[1]); if (url.protocol === 'https:') src = url.href; } catch (_) {}
        html += src ? `<img class="body-image" src="${escapeHtml(src)}" alt="" loading="lazy">` : escapeHtml(match[0]);
        last = match.index + match[0].length;
      }
      return html + escapeHtml(text.slice(last));
    };
    const nextUrl = () => `auth.html?next=${encodeURIComponent(location.pathname + location.search)}#login`;
    function showNotice(message = '', kind = '') { notice.textContent = message; notice.className = `notice ${kind}`; }
    function gateHtml(scope, price, groupCode, contentId) {
      const label = scope === 'publication' ? 'Subscribe to publication' : scope === 'group' ? `Subscribe to group ${escapeHtml(groupCode || '')}` : scope === 'update' ? 'Subscribe to update' : 'Subscribe to post';
      return `<div class="gate"><strong>${label}</strong><span>Price: $${money(price)}</span><div class="post-actions"><button class="button" type="button" data-purchase data-scope="${escapeHtml(scope)}" data-content-id="${escapeHtml(contentId)}" data-group-code="${escapeHtml(groupCode || '')}">${label} · $${money(price)}</button></div></div>`;
    }
    function bindPurchaseButtons() {
      document.querySelectorAll('[data-purchase]').forEach(button => button.onclick = async () => {
        if (!session || session.user?.is_anonymous) {
          showNotice('Please log in before subscribing.', 'error');
          document.getElementById('login-card').classList.remove('hidden');
          document.getElementById('login-link').focus();
          return;
        }
        try {
        button.disabled = true; showNotice('Processing purchase…');
        const scope = button.dataset.scope;
        let result;
        if (scope === 'publication') {
          result = await sb.rpc('purchase_publication_subscription', { target_publication_id: shared.publication_id, request_key: crypto.randomUUID() });
        } else if (scope === 'group') {
          result = await sb.rpc('purchase_content_subscription_group', { target_publication_id: shared.publication_id, target_group_code: button.dataset.groupCode, request_key: crypto.randomUUID() });
        } else {
          result = await sb.rpc('purchase_publication_content', { target_publication_id: shared.publication_id, target_kind: scope, target_content_id: button.dataset.contentId, request_key: crypto.randomUUID() });
        }
        button.disabled = false;
        if (result.error) { showNotice(result.error.message.includes('Insufficient') ? 'Insufficient USD balance. Open your wallet to top up.' : result.error.message, 'error'); return; }
        showNotice('Purchase completed.', 'success');
        await load();
        } catch (_) { showNotice('Purchase failed. Please try again.', 'error'); }
        finally { button.disabled = false; }
      });
    }
    function render(row) {
      shared = row;
      document.title = `${row.title || 'Post'} · SheSay`;
      let html = `<p class="eyebrow">SHARED STORY</p><div class="meta share-author">${escapeHtml(row.author_name || 'SheSay user')}</div>${row.title ? `<h1>${escapeHtml(row.title)}</h1>` : ''}`;
      if (row.locked) {
        html += gateHtml(row.scope, row.price, row.group_code, row.id);
      } else {
        html += `<div class="body">${bodyHtml(row.content)}</div>`;
        const updates = Array.isArray(row.updates) ? row.updates : [];
        if (updates.length) {
          html += '<section class="updates"><h2>Later updates</h2>';
          for (const update of updates) {
            html += `<div class="update"><div class="meta">${new Date(update.created_at).toLocaleString()}</div>`;
            html += update.locked ? gateHtml(update.scope, update.price, null, update.id) : `<div class="body">${bodyHtml(update.content)}</div>`;
            html += '</div>';
          }
          html += '</section>';
        }
      }
      el.innerHTML = html;
      const appLink = document.createElement('a');
      appLink.className = 'button open-app';
      appLink.href = `shesay://post?id=${encodeURIComponent(row.id)}`;
      appLink.textContent = 'Continue in SheSay';
      el.appendChild(appLink);
      bindPurchaseButtons();
    }
    async function load() {
      if (!id) { el.innerHTML = '<p class="post-error">This share link is invalid.</p>'; return; }
      session = (await sb.auth.getSession()).data.session;
      document.getElementById('login-card').classList.toggle('hidden', !!session && !session.user?.is_anonymous);
      document.getElementById('login-link').href = nextUrl();
      document.getElementById('register-link').href = nextUrl().replace('#login', '#register');
      const { data, error } = await sb.rpc('get_shared_post', { target_post_id: id });
      if (error || !data) { el.innerHTML = '<p class="post-error">This post does not exist, is unavailable, or cannot be shared.</p>'; return; }
      render(data);
    }
    sb.auth.onAuthStateChange(() => setTimeout(load, 0));
    load();
  </script>
</body>
</html>
