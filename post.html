<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a765c5">
  <title>SheSay post</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
  <style>
    .shared-post{padding:clamp(26px,6vw,55px)}
    .shared-post .meta{color:var(--muted);font:13px/1.6 ui-rounded,"PingFang SC",sans-serif}
    .shared-post .body{margin-top:28px;white-space:pre-wrap;line-height:2;overflow-wrap:anywhere}
    .post-error{padding:45px 0;text-align:center;color:#a52c54}
    .updates{margin-top:38px}.updates h2{font-size:18px}.update{padding:18px 0;border-top:1px solid var(--line)}
    .gate{margin-top:24px;padding:20px;border:1px solid var(--line);border-radius:14px;background:#faf8fb;text-align:center}
    .gate strong,.gate span{display:block}.gate span{margin:6px 0 14px;color:var(--muted);font-size:14px}
    .post-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  </style>
</head>
<body>
  <main class="site-shell">
    <article id="post" class="paper shared-post"><p class="eyebrow">SHE SAY · SHARED POST</p><div class="meta">Loading…</div></article>
    <div id="notice" class="notice" aria-live="polite"></div>
    <footer class="site-footer"><a href="index.html">Visit SheSay &gt;</a></footer>
  </main>
  <script src="site.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const el = document.getElementById('post');
    const notice = document.getElementById('notice');
    const sb = SheSay.client;
    const APP_HOME = 'https://xn--1uss88i.com/';
    let openAppPending = false;
    function launchApp(deepLink) {
      if (!deepLink || openAppPending) return;
      openAppPending = true;
      if (/Android/i.test(navigator.userAgent)) {
        location.href = deepLink.replace(/^shesay:\/\//, 'intent://') +
          '#Intent;scheme=shesay;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=' +
          encodeURIComponent(APP_HOME) + ';end';
        setTimeout(() => { openAppPending = false; }, 250);
        return;
      }
      const cancel = () => {
        clearTimeout(fallbackTimer);
        document.removeEventListener('visibilitychange', onVisibility);
        window.removeEventListener('pagehide', cancel);
        openAppPending = false;
      };
      const onVisibility = () => { if (document.hidden) cancel(); };
      document.addEventListener('visibilitychange', onVisibility);
      window.addEventListener('pagehide', cancel);
      const fallbackTimer = setTimeout(() => {
        const stillVisible = document.visibilityState === 'visible';
        cancel();
        if (stillVisible) location.assign(APP_HOME);
      }, 1500);
      location.href = deepLink;
    }
    let session = null;
    let shared = null;
    const escapeHtml = value => { const node = document.createElement('div'); node.textContent = value ?? ''; return node.innerHTML; };
    const money = value => Number(value || 0).toFixed(2);
    const nextUrl = () => `auth.html?next=${encodeURIComponent(location.pathname + location.search)}#login`;
    function showNotice(message = '', kind = '') { notice.textContent = message; notice.className = `notice ${kind}`; }
    function gateHtml(scope, price, groupCode, contentId) {
      if (!session) return `<div class="gate"><strong>Log in required</strong><span>Log in to verify your purchase and view this paid content.</span><div class="post-actions"><a class="button" href="${nextUrl()}">Log in</a></div></div>`;
      const label = scope === 'publication' ? 'Subscribe to publication' : scope === 'group' ? `Subscribe to group ${escapeHtml(groupCode || '')}` : scope === 'update' ? 'Purchase update' : 'Purchase post';
      return `<div class="gate"><strong>${label}</strong><span>Price: $${money(price)}</span><div class="post-actions"><button class="button" type="button" data-purchase data-scope="${escapeHtml(scope)}" data-content-id="${escapeHtml(contentId)}" data-group-code="${escapeHtml(groupCode || '')}">${label} · $${money(price)}</button></div></div>`;
    }
    function bindPurchaseButtons() {
      document.querySelectorAll('[data-purchase]').forEach(button => button.onclick = async () => {
        button.disabled = true; showNotice('Processing purchase…');
        const scope = button.dataset.scope;
        let result;
        if (scope === 'publication') {
          result = await sb.rpc('purchase_publication_subscription', { target_publication_id: shared.publication_id, request_key: crypto.randomUUID() });
        } else if (scope === 'group') {
          result = await sb.rpc('purchase_content_subscription_group', { target_publication_id: shared.publication_id, target_group_code: button.dataset.groupCode, request_key: crypto.randomUUID() });
        } else {
          result = await sb.rpc('purchase_publication_content', { target_publication_id: shared.publication_id, target_kind: scope, target_content_id: button.dataset.contentId, request_key: crypto.randomUUID() });
        }
        button.disabled = false;
        if (result.error) { showNotice(result.error.message.includes('Insufficient') ? 'Insufficient USD balance. Open your wallet to top up.' : result.error.message, 'error'); return; }
        showNotice('Purchase completed.', 'success');
        await load();
      });
    }
    function render(row) {
      shared = row;
      document.title = `${row.title || 'Post'} · SheSay`;
      let html = `<p class="eyebrow">SHE SAY · SHARED POST</p><div class="meta">${escapeHtml(row.author_name || 'SheSay user')}</div><h1>${escapeHtml(row.title || 'Untitled post')}</h1><div class="post-actions"><button class="button ghost" type="button" id="openInApp">Open in app</button></div>`;
      if (row.locked) {
        html += gateHtml(row.scope, row.price, row.group_code, row.id);
      } else {
        html += `<div class="body">${escapeHtml(row.content || '')}</div>`;
        const updates = Array.isArray(row.updates) ? row.updates : [];
        if (updates.length) {
          html += '<section class="updates"><h2>Later updates</h2>';
          for (const update of updates) {
            html += `<div class="update"><div class="meta">${new Date(update.created_at).toLocaleString()}</div>`;
            html += update.locked ? gateHtml(update.scope, update.price, null, update.id) : `<div class="body">${escapeHtml(update.content || '')}</div>`;
            html += '</div>';
          }
          html += '</section>';
        }
      }
      el.innerHTML = html;
      document.getElementById('openInApp').onclick = () => launchApp(`shesay://post?id=${encodeURIComponent(row.id)}`);
      bindPurchaseButtons();
    }
    async function load() {
      if (!id) { el.innerHTML = '<p class="post-error">This share link is invalid.</p>'; return; }
      session = (await sb.auth.getSession()).data.session;
      const { data, error } = await sb.rpc('get_shared_post', { target_post_id: id });
      if (error || !data) { el.innerHTML = '<p class="post-error">This post does not exist, is unavailable, or cannot be shared.</p>'; return; }
      render(data);
    }
    sb.auth.onAuthStateChange(() => load());
    load();
  </script>
</body>
</html>
