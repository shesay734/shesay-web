<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a765c5">
  <title>SheSay publication</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
  <style>
    .shared-publication{padding:clamp(26px,6vw,55px)}
    .shared-publication .meta{color:var(--muted);font:13px/1.6 ui-rounded,"PingFang SC",sans-serif}
    .publication-cover{width:100%;max-height:520px;margin:22px 0 0;object-fit:cover}
    .synopsis{margin-top:24px;white-space:pre-wrap;line-height:2;overflow-wrap:anywhere}
    .publication-tags{margin:18px 0 0;color:var(--muted);font-size:14px}
    .open-app{width:100%;margin-top:28px}
        .publication-error{padding:45px 0;text-align:center;color:#a52c54}
        .hidden{display:none}
        .download-gate{margin-top:24px;padding:20px;border:1px solid var(--line);border-radius:14px;background:#faf8fb;text-align:center}
        .download-gate strong,.download-gate span{display:block}.download-gate span{margin:6px 0 14px;color:var(--muted);font-size:14px}
      </style>
    </head>
    <body>
      <main class="site-shell">
        <article id="publication" class="paper shared-publication"><p class="eyebrow">SHE SAY · SHARED PUBLICATION</p><div class="meta">Loading…</div></article>
        <div id="downloadGate" class="download-gate hidden">
          <strong>您还未下载app</strong>
          <span>下载 SheSay App 后即可打开此内容。</span>
          <div><a class="button open-app" href="https://play.google.com/store/apps/details?id=com.shesay_app" target="_blank" rel="noopener">下载</a></div>
        </div>
        <footer class="site-footer"><a href="index.html">Visit SheSay &gt;</a></footer>
      </main>
  <script src="site.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const el = document.getElementById('publication');
    const sb = SheSay.client;
    const APP_HOME = 'https://xn--1uss88i.com/';
    let openAppPending = false;
    function launchApp(deepLink) {
      if (!deepLink || openAppPending) return;
      openAppPending = true;
      if (/Android/i.test(navigator.userAgent)) {
        location.href = deepLink.replace(/^shesay:\/\//, 'intent://') +
          '#Intent;scheme=shesay;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=' +
          encodeURIComponent(APP_HOME) + ';end';
        setTimeout(() => { openAppPending = false; }, 250);
        return;
      }
      const cancel = () => {
        clearTimeout(fallbackTimer);
        document.removeEventListener('visibilitychange', onVisibility);
        window.removeEventListener('pagehide', cancel);
        openAppPending = false;
      };
      const onVisibility = () => { if (document.hidden) cancel(); };
      document.addEventListener('visibilitychange', onVisibility);
      window.addEventListener('pagehide', cancel);
      const fallbackTimer = setTimeout(() => {
              const stillVisible = document.visibilityState === 'visible';
              cancel();
              if (stillVisible) showDownloadPrompt();
            }, 1200);
            location.href = deepLink;
          }
          function showDownloadPrompt() {
            const gate = document.getElementById('downloadGate');
            if (gate) gate.classList.remove('hidden');
            const link = el.querySelector('.open-app');
            if (link && !link.dataset.downloadReady) {
              link.textContent = '您还未下载app';
            }
          }
    const escapeHtml = value => { const node = document.createElement('div'); node.textContent = value ?? ''; return node.innerHTML; };
    function render(row) {
      document.title = `${row.title || 'Publication'} · SheSay`;
      const tags = Array.isArray(row.tags) ? row.tags.filter(Boolean) : [];
      const cover = row.cover_image_url
        ? `<img class="publication-cover" src="${escapeHtml(row.cover_image_url)}" alt="${escapeHtml(row.title || 'Publication cover')}">`
        : '';
      const tagText = tags.length ? `<p class="publication-tags">${escapeHtml(tags.join(' · '))}</p>` : '';
      const appLink = `shesay://publication?id=${encodeURIComponent(row.id)}`;
      el.innerHTML = `<p class="eyebrow">SHE SAY · SHARED PUBLICATION</p><div class="meta">${escapeHtml(row.author_name || 'SheSay user')}</div><h1>${escapeHtml(row.title || 'Untitled publication')}</h1>${cover}<section class="synopsis">${escapeHtml(row.synopsis || '')}</section>${tagText}<a class="button open-app" href="${appLink}">Open in App</a>`;
      const appLinkEl = el.querySelector('.open-app');
      appLinkEl.onclick = event => { event.preventDefault(); launchApp(appLinkEl.href); };
    }
    async function load() {
      if (!id) { el.innerHTML = '<p class="publication-error">This share link is invalid.</p>'; return; }
      const { data, error } = await sb.rpc('get_shared_publication', { target_publication_id: id });
      if (error || !data) { el.innerHTML = '<p class="publication-error">This publication does not exist, is unavailable, or cannot be shared.</p>'; return; }
      render(data);
    }
    load();
  </script>
</body>
</html>
