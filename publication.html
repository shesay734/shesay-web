<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="app-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>SheSay publication</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="share.css">
</head>
<body class="share-page share-publication">
  <main class="share-shell">
    <a class="share-skip" href="#share-content">Skip to content</a>
    <header class="share-header">
      <a class="share-brand" href="app.html"><img src="app-icon.png" alt="" width="40" height="40"><span>SheSay<small>Stories. Connections. Community.</small></span></a>
      <a class="share-explore" href="app.html">Discover SheSay <span aria-hidden="true">↗</span></a>
    </header>
    <div id="share-content" tabindex="-1"></div>
    <article id="publication" class="paper shared-publication"><p class="eyebrow">THE READING ROOM</p><div class="share-loading" role="status">Loading publication…</div></article>
    <aside class="share-discover" aria-label="Discover SheSay"><img src="app-icon.png" alt="" width="44" height="44"><div><strong>A little closer to your community.</strong><p>Discover more stories and conversations on SheSay.</p></div><a href="app.html">Explore the app <span aria-hidden="true">↗</span></a></aside>
    <footer class="share-footer"><span>Shared on SheSay</span><nav aria-label="Footer"><a href="help-feedback.html">Help</a><a href="privacy-policy.html">Privacy</a><a href="terms-of-service.html">Terms</a></nav></footer>
  </main>
  <script src="i18n.js"></script>
  <script src="site.js"></script>
  <script src="open-app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const el = document.getElementById('publication');
    const sb = SheSay.client;
    const escapeHtml = value => { const node = document.createElement('div'); node.textContent = value ?? ''; return node.innerHTML; };
    function render(row) {
      document.title = `${row.title || 'Publication'} · SheSay`;
      const tags = Array.isArray(row.tags) ? row.tags.filter(Boolean) : [];
      const cover = row.cover_image_url
        ? `<img class="publication-cover" src="${escapeHtml(row.cover_image_url)}" alt="${escapeHtml(row.title || 'Publication cover')}">`
        : '';
      const tagText = tags.length ? `<div class="publication-tags">${tags.map(tag => `<span>${escapeHtml(tag)}</span>`).join('')}</div>` : '';
      const appLink = `shesay://publication?id=${encodeURIComponent(row.id)}`;
      el.innerHTML = `<p class="eyebrow">THE READING ROOM</p><div class="meta share-author">${escapeHtml(row.author_name || 'SheSay user')}</div><h1>${escapeHtml(row.title || 'Untitled publication')}</h1>${cover}<section class="synopsis">${escapeHtml(row.synopsis || '')}</section>${tagText}<a class="button open-app" href="${appLink}">Read in SheSay</a>`;
    }
    async function load() {
      if (!id) { el.innerHTML = '<p class="publication-error">This share link is invalid.</p>'; return; }
      const { data, error } = await sb.rpc('get_shared_publication', { target_publication_id: id });
      if (error || !data) { el.innerHTML = '<p class="publication-error">This publication does not exist, is unavailable, or cannot be shared.</p>'; return; }
      render(data);
    }
    load();
  </script>
</body>
</html>
