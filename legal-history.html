<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="app-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Version history - SheSay</title>
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="site.css">
</head>
<body><main class="site-shell"><article class="paper"><header class="page-heading"><h1 id="title" data-no-translate>Version history</h1><p class="date" data-no-translate><a id="back" href="legal.html">All terms &amp; policies</a></p></header>
<ul id="versions" class="legal-history" data-no-translate></ul>
</article><nav class="policy-links" aria-label="Policies and support"><a href="index.html">Company</a><a href="app.html">Download</a><a href="legal.html">All terms &amp; policies</a><a href="terms-of-service.html">Terms of Service</a><a href="author-terms.html">Author Terms of Service</a><a href="privacy-policy.html">Privacy Policy</a><a href="cookie-policy.html">Cookie Policy</a><a href="dmca-notice.html">DMCA Notice</a><a href="child-safety-standards.html">Child Safety Standards</a><a href="data-deletion.html">Account &amp; Data Deletion</a><a href="refund-policy.html">Refund Policy</a><a href="help-feedback.html">Help &amp; feedback</a></nav></main><script src="i18n.js"></script>
  <script src="legal-common.js"></script>
  <script>
    // Every published version of one legal document, newest first.
    (() => {
      const L = window.SheSayLegal;
      const key = new URLSearchParams(location.search).get('doc');
      let shown = null;
      async function show() {
        const locale = L.locale();
        const index = await L.index();
        const doc = index.documents[key];
        if (!doc) return;
        const latest = doc.versions.find((v) => v.version === doc.current) || doc.versions[0];
        const name = latest.titles[locale] || latest.titles.en;
        document.getElementById('title').textContent = `${name} · ${L.label('history', locale)}`;
        document.title = `${name} · ${L.label('history', locale)} - SheSay`;
        const back = document.getElementById('back');
        back.href = doc.page;
        back.textContent = L.label('back', locale);
        const list = document.getElementById('versions');
        list.innerHTML = '';
        for (const v of doc.versions) {
          const li = document.createElement('li');
          const link = document.createElement('a');
          link.href = v.version === doc.current ? doc.page : `${doc.page}?version=${encodeURIComponent(v.version)}`;
          link.textContent = `${L.label('version', locale)} ${v.version}`;
          const right = document.createElement('span');
          right.className = 'muted';
          right.textContent = `${L.label('published', locale)}: ${L.date(v.published, locale)}`;
          const left = document.createElement('span');
          left.append(link);
          if (v.version === doc.current) {
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = L.label('current', locale);
            left.append(' ', tag);
          }
          li.append(left, right);
          list.append(li);
        }
        shown = locale;
      }
      new MutationObserver(() => { if (L.locale() !== shown) show(); })
        .observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
      show().catch(() => {});
    })();
  </script>
  <script src="site.js"></script>
</body>
</html>
